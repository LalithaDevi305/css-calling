<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>random jokes generator</title>
</head>
<body>
    <style>
        body{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
            background-color: rgb(154, 219, 215);
        }
    </style>
    <div class="container">
        <div class="card">
          <div class="title">
            <h1>Random Jokes Generator</h1>
          </div>
          <div id="joke-content">
            <p id="joke">Click the generate button to get a setup joke-content</p>
            <p id="answer">And the punchline will appear here</p>
            <button id="generator">Generate</button>
        </div>
    </div>
</div>
    <script src="./fitch.js"></script>
</body>
</html>
