<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.free-power-point-templates.com%2Farticles%2Fhow-to-create-an-animated-countdown-timer-in-powerpoint%2F&psig=AOvVaw0WhhCqItbhWyr5Fpt1tIDC&ust=1736334818804000&source=images&cd=vfe&opi=89978449&ved=0CBQQjRxqFwoTCPjC97i944oDFQAAAAAdAAAAABAE" type="image/x-icon">
    <link rel="stylesheet" href="./script.css">
</head>
<body>
    <button onclick="counter">COUNTER</button>
    <div id="counter">
        <img src="./images (1).jpeg"alt="image"height=200>
        <p id="count">0</p>
        <div id="buttons">
            <button onclick="incr()">+</button>
            <button onclick="decr()">-</button>
            <button onclick="reset()">rest</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
